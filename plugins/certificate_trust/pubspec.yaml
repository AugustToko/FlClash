name: certificate_trust
description: Platform certificate trust verification for FlClash.
version: 0.0.1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.follow.clash.certificate_trust
        pluginClass: CertificateTrustPlugin
