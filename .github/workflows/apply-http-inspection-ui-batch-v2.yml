name: Apply HTTP inspection UI batch v2

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - tools/apply_http_inspection_ui_batch_v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: http-inspection-ui-batch-v2
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[http-ui-batch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Apply UI batch
        run: python3 tools/apply_http_inspection_ui_batch_v2.py
      - name: Generate localization
        run: dart run intl_utils:generate
      - name: Format Dart
        run: |
          dart format \
            lib/models/http_inspection.dart \
            lib/models/common.dart \
            lib/models/tls_inspection_runtime.dart \
            lib/models/http_capture.dart \
            lib/models/models.dart \
            lib/core/controller.dart \
            lib/core/interface.dart \
            lib/providers/http_capture.dart \
            lib/views/http_capture.dart \
            lib/views/http_inspection_widgets.dart \
            test/core/tls_runtime_test.dart \
            test/models/http_capture_test.dart \
            test/models/http_inspection_test.dart \
            test/providers/http_capture_test.dart \
            test/views/http_capture_preview_test.dart \
            test/views/http_inspection_widgets_test.dart
      - name: Run focused Flutter tests
        run: |
          flutter test \
            test/core/tls_runtime_test.dart \
            test/models/http_capture_test.dart \
            test/models/http_inspection_test.dart \
            test/providers/http_capture_test.dart \
            test/views/http_capture_preview_test.dart \
            test/views/http_inspection_widgets_test.dart
      - name: Analyze inspection surface
        run: |
          flutter analyze \
            lib/models/http_inspection.dart \
            lib/models/common.dart \
            lib/models/tls_inspection_runtime.dart \
            lib/models/http_capture.dart \
            lib/core/controller.dart \
            lib/core/interface.dart \
            lib/providers/http_capture.dart \
            lib/views/http_capture.dart \
            lib/views/http_inspection_widgets.dart
      - name: Commit batch
        run: |
          rm -f tools/apply_http_inspection_ui_batch.py
          rm -f tools/apply_http_inspection_ui_batch_v2.py
          rm -f tools/http_inspection_ui_*.py
          rm -f tools/inspect_http_capture_ui.txt
          rm -f .github/workflows/apply-http-inspection-ui-batch.yml
          rm -f .github/workflows/apply-http-inspection-ui-batch-v2.yml
          rm -f .github/workflows/inspect-http-capture-ui.yml
          git config user.name "FlClash Batch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(http): expose HTTP/2 streams and authorized payload inspection [http-ui-batch-applied]"
          git push origin HEAD:feat/http2-stream-capture-policy-20261009
