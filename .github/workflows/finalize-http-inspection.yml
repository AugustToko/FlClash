name: Finalize HTTP inspection

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - finalize-http-inspection.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-http-inspection
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Fix stale boundary assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core/tls_inspection_runtime_test.go')
          text = path.read_text()
          old = '''\tif started.Status.Mode != "loopback-connect-http1" || started.Status.CapturesPayload || started.Status.ChangesSystemProxy {\n\t\tt.Fatal("misleading runtime boundary")\n\t}\n'''
          new = '''\tif started.Status.Mode != "loopback-connect-http1-h2" ||\n\t\tstarted.Status.CapturesPayload ||\n\t\t!started.Status.CapturePolicy.MetadataOnly() ||\n\t\tstarted.Status.ChangesSystemProxy {\n\t\tt.Fatal("misleading runtime boundary")\n\t}\n'''
          if old not in text:
              raise SystemExit('stale runtime boundary assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot scaffolding
        run: |
          find .github/workflows -maxdepth 1 -type f ! -name build.yaml ! -name finalize-http-inspection.yml -delete
          rm -rf tools
      - name: Resolve dependencies
        run: flutter pub get
      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
      - name: Format Dart and Go
        run: |
          dart format lib test tool plugins setup.dart
          gofmt -w core/*.go core/platform core/tun core/inspectionruntime
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run HTTP inspection Flutter tests
        run: |
          flutter test --reporter expanded \
            test/core/tls_runtime_test.dart \
            test/models/http_capture_test.dart \
            test/providers/http_capture_test.dart \
            test/views/http_capture_preview_test.dart
      - name: Apply Core patches
        run: bash tool/apply_core_patches.sh
      - name: Run Go core tests
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 . ./inspectionruntime
          CGO_ENABLED=1 go test -race -count=1 ./inspectionruntime
          go vet . ./inspectionruntime
          GOOS=linux go vet ./platform
      - name: Commit finalized branch
        run: |
          rm -f finalize-http-inspection.trigger
          rm -f .github/workflows/finalize-http-inspection.yml
          git checkout -- pubspec.yaml pubspec.lock
          git config user.name "FlClash Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(http): finalize HTTP/2 inspection and capture policy"
          git push origin HEAD:feat/http2-stream-capture-policy-20261009
