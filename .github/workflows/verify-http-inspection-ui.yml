name: Verify HTTP inspection UI

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - tools/verify_http_inspection_ui.txt

permissions:
  contents: write

concurrency:
  group: http-inspection-ui-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Materialize pending batch when necessary
        run: |
          if [ ! -f lib/views/http_inspection_widgets.dart ] && [ -f tools/apply_http_inspection_ui_batch_v2.py ]; then
            python3 tools/apply_http_inspection_ui_batch_v2.py
          fi
      - name: Generate localization and format
        run: |
          dart run intl_utils:generate
          dart format \
            lib/models/http_inspection.dart \
            lib/models/common.dart \
            lib/models/tls_inspection_runtime.dart \
            lib/models/http_capture.dart \
            lib/models/models.dart \
            lib/core/controller.dart \
            lib/core/interface.dart \
            lib/providers/http_capture.dart \
            lib/views/http_capture.dart \
            lib/views/http_inspection_widgets.dart \
            test/core/tls_runtime_test.dart \
            test/models/http_capture_test.dart \
            test/models/http_inspection_test.dart \
            test/providers/http_capture_test.dart \
            test/views/http_capture_preview_test.dart \
            test/views/http_inspection_widgets_test.dart
      - name: Focused tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test \
            test/core/tls_runtime_test.dart \
            test/models/http_capture_test.dart \
            test/models/http_inspection_test.dart \
            test/providers/http_capture_test.dart \
            test/views/http_capture_preview_test.dart \
            test/views/http_inspection_widgets_test.dart \
            2>&1 | tee /tmp/http-ui-tests.log
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze \
            lib/models/http_inspection.dart \
            lib/models/common.dart \
            lib/models/tls_inspection_runtime.dart \
            lib/models/http_capture.dart \
            lib/core/controller.dart \
            lib/core/interface.dart \
            lib/providers/http_capture.dart \
            lib/views/http_capture.dart \
            lib/views/http_inspection_widgets.dart \
            2>&1 | tee /tmp/http-ui-analyze.log
      - name: Preserve result
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          git config user.name "FlClash Batch Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$TEST_OUTCOME" = success ] && [ "$ANALYZE_OUTCOME" = success ]; then
            rm -f tools/apply_http_inspection_ui_batch.py
            rm -f tools/apply_http_inspection_ui_batch_v2.py
            rm -f tools/http_inspection_ui_*.py
            rm -f tools/inspect_http_capture_ui.txt
            rm -f tools/verify_http_inspection_ui.txt
            rm -f tools/http_inspection_ui_failure.log
            rm -f .github/workflows/apply-http-inspection-ui-batch.yml
            rm -f .github/workflows/apply-http-inspection-ui-batch-v2.yml
            rm -f .github/workflows/inspect-http-capture-ui.yml
            rm -f .github/workflows/verify-http-inspection-ui.yml
            git add -A
            git commit -m "feat(http): expose HTTP/2 streams and authorized payload inspection [http-ui-batch-applied]" || true
          else
            {
              echo '===== TESTS ====='
              tail -n 240 /tmp/http-ui-tests.log || true
              echo '===== ANALYZE ====='
              tail -n 240 /tmp/http-ui-analyze.log || true
            } > tools/http_inspection_ui_failure.log
            git add -A
            git commit -m "chore(http): preserve HTTP inspection UI diagnostics [http-ui-debug]" || true
          fi
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin feat/http2-stream-capture-policy-20261009 && \
              git push origin HEAD:feat/http2-stream-capture-policy-20261009 && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: Fail after preserving diagnostics
        if: ${{ steps.tests.outcome != 'success' || steps.analyze.outcome != 'success' }}
        run: exit 1
