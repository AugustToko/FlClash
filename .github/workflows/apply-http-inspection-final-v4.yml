name: Apply final HTTP inspection integration v4

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - tools/http-inspection-integration-v4.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-http-inspection-integration-v4
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[http-inspection-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Apply, verify, clean, and commit
        run: bash tools/run_http_inspection_integration_v4.sh
