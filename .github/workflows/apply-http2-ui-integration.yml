name: Apply HTTP2 UI integration

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - '.http2-ui-patch/**'
      - http2-ui-integration.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-http2-ui-integration
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[http2-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
          submodules: recursive

      - name: Verify and apply integration patch
        run: |
          set -euo pipefail
          expected_encoded=f83ee227d6576e985fd245435612f2aacd31d07aea7f4879e83f9e5bcded6524
          expected_patch=7f1bd18babc2f5dd1e370719d14a9c6a98ab673c684b2c4bac929060559055ec
          expected_preview_fix=b4fa95b98fcffc3b440d7677ee7a1bb9f313e8dfe71a35dc36c44289d53d417d
          parts=(.http2-ui-patch/part-*)
          test "${#parts[@]}" -eq 8
          printf '%s\n' "${parts[@]}"
          cat "${parts[@]}" > /tmp/http2-ui-integration.b64
          actual_encoded="$(sha256sum /tmp/http2-ui-integration.b64 | cut -d' ' -f1)"
          echo "encoded_sha256=$actual_encoded"
          test "$actual_encoded" = "$expected_encoded"
          base64 --decode /tmp/http2-ui-integration.b64 | gunzip > /tmp/http2-ui-integration.patch
          actual_patch="$(sha256sum /tmp/http2-ui-integration.patch | cut -d' ' -f1)"
          echo "patch_sha256=$actual_patch"
          test "$actual_patch" = "$expected_patch"
          git apply --check --verbose /tmp/http2-ui-integration.patch
          git apply --verbose /tmp/http2-ui-integration.patch
          python3 - <<'PY'
          from pathlib import Path

          capture = Path('lib/models/http_capture.dart')
          text = capture.read_text()
          old = "import 'common.dart';\nimport 'tls_inspection_runtime.dart';"
          new = "import 'common.dart';\nimport 'http_inspection.dart';\nimport 'tls_inspection_runtime.dart';"
          if text.count(old) != 1:
              raise SystemExit('unexpected HTTP capture import block')
          capture.write_text(text.replace(old, new, 1))

          runtime = Path('lib/models/tls_inspection_runtime.dart')
          text = runtime.read_text()
          policy = 'Map<String, dynamic>.from(rawPolicy),'
          if text.count(policy) != 2:
              raise SystemExit('unexpected capture policy conversion count')
          text = text.replace(policy, 'Map<String, dynamic>.from(rawPolicy as Map),')
          go_away = 'Map<String, Object?>.from(rawGoAway),'
          if text.count(go_away) != 1:
              raise SystemExit('unexpected GOAWAY conversion count')
          text = text.replace(
              go_away,
              'Map<String, Object?>.from(rawGoAway as Map),',
          )
          runtime.write_text(text)
          PY
          actual_preview_fix="$(sha256sum .http2-ui-patch/preview-test-fix.patch | cut -d' ' -f1)"
          echo "preview_fix_sha256=$actual_preview_fix"
          test "$actual_preview_fix" = "$expected_preview_fix"
          git apply --check --verbose .http2-ui-patch/preview-test-fix.patch
          git apply --verbose .http2-ui-patch/preview-test-fix.patch
          git diff --check

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Resolve dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Generate localization
        run: dart run intl_utils:generate

      - name: Format Dart
        run: dart format lib test tool plugins setup.dart

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos

      - name: Update HTTP capture goldens
        run: flutter test --update-goldens test/views/http_capture_preview_test.dart

      - name: Run focused Flutter tests
        run: |
          flutter test --reporter expanded \
            test/core/controller_test.dart \
            test/core/protocol_contract_test.dart \
            test/core/tls_runtime_test.dart \
            test/manager/core_manager_test.dart \
            test/models/http_capture_test.dart \
            test/models/http_inspection_test.dart \
            test/providers/http_capture_test.dart \
            test/providers/tls_inspection_runtime_test.dart \
            test/views/http_capture_preview_test.dart

      - name: Apply Core patches
        run: bash tool/apply_core_patches.sh

      - name: Run Go core regression
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          test -z "$(gofmt -l ./*.go ./platform ./tun ./inspectionruntime)" || {
            gofmt -l ./*.go ./platform ./tun ./inspectionruntime >&2
            exit 1
          }
          go test -count=1 . ./inspectionruntime
          CGO_ENABLED=1 go test -race -count=1 ./inspectionruntime
          go vet . ./inspectionruntime
          GOOS=linux go vet ./platform

      - name: Commit integrated surface
        run: |
          set -euo pipefail
          rm -rf .http2-ui-patch
          rm -f http2-ui-integration.patch.gz.b64
          rm -f http2-ui-integration.trigger
          rm -f .github/workflows/apply-http2-ui-integration.yml
          git checkout -- pubspec.yaml pubspec.lock
          git diff --check
          git config user.name "FlClash Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(http): expose HTTP/2 streams and authorized payload inspection [http2-ui-applied]"
          git push origin HEAD:feat/http2-stream-capture-policy-20261009
