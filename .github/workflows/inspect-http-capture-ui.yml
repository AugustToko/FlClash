name: Inspect HTTP capture UI

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - tools/inspect_http_capture_ui.txt

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
      - name: Print HTTP capture view integration points
        run: |
          echo '===== VIEW 1-240 ====='
          sed -n '1,240p' lib/views/http_capture.dart
          echo '===== VIEW 240-520 ====='
          sed -n '240,520p' lib/views/http_capture.dart
          echo '===== VIEW 520-900 ====='
          sed -n '520,900p' lib/views/http_capture.dart
          echo '===== VIEW 900-1320 ====='
          sed -n '900,1320p' lib/views/http_capture.dart
          echo '===== PROVIDER TEST ====='
          sed -n '1,360p' test/providers/http_capture_test.dart
          echo '===== PREVIEW TEST 1-420 ====='
          sed -n '1,420p' test/views/http_capture_preview_test.dart
          echo '===== MODEL TEST 1-360 ====='
          sed -n '1,360p' test/models/http_capture_test.dart
