name: Export HTTP UI source

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - tools/export_http_ui_source.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
      - name: Bundle source
        run: |
          zip -r /tmp/http-ui-source.zip \
            lib/models/http_inspection.dart \
            lib/models/common.dart \
            lib/models/tls_inspection_runtime.dart \
            lib/models/http_capture.dart \
            lib/models/models.dart \
            lib/core/controller.dart \
            lib/core/interface.dart \
            lib/providers/http_capture.dart \
            lib/views/http_capture.dart \
            arb \
            test/core/tls_runtime_test.dart \
            test/models/http_capture_test.dart \
            test/providers/http_capture_test.dart \
            test/views/http_capture_preview_test.dart \
            core/inspectionruntime/runtime.go \
            core/inspectionruntime/http1_metadata.go \
            core/inspectionruntime/http1_timeline.go \
            core/inspectionruntime/http2_headers.go \
            core/inspectionruntime/http2_timeline.go \
            core/inspectionruntime/capture_policy.go \
            core/tls_inspection_runtime.go
      - uses: actions/upload-artifact@v4
        with:
          name: http-ui-source
          path: /tmp/http-ui-source.zip
          if-no-files-found: error
          retention-days: 1
