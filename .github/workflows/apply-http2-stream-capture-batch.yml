name: Apply HTTP2 stream capture batch

on:
  push:
    branches:
      - feat/http2-stream-capture-policy-20261009
    paths:
      - tools/apply_http2_stream_capture_batch.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: http2-stream-capture-batch
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[http2-batch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/http2-stream-capture-policy-20261009
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Apply batch
        run: python3 tools/apply_http2_stream_capture_batch.py
      - name: Format Go
        run: |
          gofmt -w \
            core/http_observer.go \
            core/tls_inspection_runtime.go \
            core/inspectionruntime/capture_policy.go \
            core/inspectionruntime/http1_metadata.go \
            core/inspectionruntime/http1_timeline.go \
            core/inspectionruntime/http2_timeline.go \
            core/inspectionruntime/runtime.go \
            core/inspectionruntime/capture_policy_test.go \
            core/inspectionruntime/http2_timeline_test.go
      - name: Validate inspection runtime
        working-directory: core
        run: go test ./inspectionruntime
      - name: Commit batch
        run: |
          rm -f tools/apply_http2_stream_capture_batch.py
          rm -f .github/workflows/apply-http2-stream-capture-batch.yml
          git config user.name "FlClash Batch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(http): inspect HTTP/2 streams with explicit capture policy [http2-batch-applied]"
          git push origin HEAD:feat/http2-stream-capture-policy-20261009
